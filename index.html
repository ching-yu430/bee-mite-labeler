<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜂蟹蟎標註工具</title>
<link rel="stylesheet" href="fonts/css/vf.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <h1>蜂蟹蟎標註工具</h1>
      <p>把蜂群照片切格、標記正常 / 異常，匯出成 PatchCore 可用的資料集</p>
    </div>
  </div>
</header>

<div class="layout">

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span id="sidebar-count">照片</span>
      <div class="sidebar-header-actions">
        <button id="sidebar-clear-all" class="sidebar-icon-btn" title="清除全部照片" aria-label="清除全部照片">🗑</button>
        <button id="sidebar-toggle" class="sidebar-icon-btn" title="收合／展開" aria-label="收合／展開側欄">◂</button>
      </div>
    </div>
    <ul id="sidebar-list" class="sidebar-list">
      <li id="sidebar-empty-msg" class="sidebar-empty">尚未上傳照片</li>
    </ul>
  </aside>

  <button id="sidebar-open" class="sidebar-open-btn" title="展開照片清單" aria-label="展開照片清單" hidden>▸</button>

  <div class="content">
  <main>

  <section class="panel" id="setup-panel">
    <div class="panel-row">
      <label class="field">
        <span>照片</span>
        <input type="file" id="photo-input" accept="image/*" multiple>
      </label>

      <label class="field field-narrow">
        <span>列數</span>
        <input type="number" id="rows-input" value="4" min="1" max="16">
      </label>
      <label class="field field-narrow">
        <span>欄數</span>
        <input type="number" id="cols-input" value="8" min="1" max="16">
      </label>
      <label class="field field-narrow">
        <span>重疊(px)</span>
        <input type="number" id="overlap-input" value="15" min="0" max="100">
      </label>
    </div>
    <p class="hint">
      上傳一張或多張照片，會依上面設定的網格自動切格。<br>
      點一下格子在「未標 → 正常 → 異常」之間循環；<b>按住拖曳</b>可以一次刷過多個格子塗上同一個狀態；滑鼠移到格子上按 <kbd>1</kbd>=正常、<kbd>2</kbd>=異常、<kbd>0</kbd>=清除，可以更快標註。<br>
      每張照片標題旁的按鈕可以一鍵把「未標」的格子全部設成正常，你只要挑出異常的格子點掉就好。
    </p>
  </section>

  <section class="panel" id="summary-panel" hidden>
    <div class="summary">
      <div class="summary-item">
        <span class="summary-num" id="count-total">0</span>
        <span class="summary-label">總格數</span>
      </div>
      <div class="summary-item is-normal">
        <span class="summary-num" id="count-normal">0</span>
        <span class="summary-label">正常</span>
      </div>
      <div class="summary-item is-abnormal">
        <span class="summary-num" id="count-abnormal">0</span>
        <span class="summary-label">異常</span>
      </div>
      <div class="summary-item">
        <span class="summary-num" id="count-unlabeled">0</span>
        <span class="summary-label">未標</span>
      </div>
    </div>
    <button id="export-btn" class="primary-btn">匯出資料集 (.zip)</button>
  </section>

  <section id="photos-container"></section>

  </main>
  </div>

</div>

<div id="loading-overlay" class="loading-overlay" hidden>
  <div class="loading-box">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">處理照片中…</p>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<div id="zoom-preview" class="zoom-preview" hidden>
  <img id="zoom-preview-img" src="" alt="">
  <div class="zoom-caption" id="zoom-preview-caption"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
