<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜂蟹蟎標註工具</title>
<link rel="stylesheet" href="fonts/css/vf.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">🍯</span>
    <div class="brand-text">
      <h1>蜂蟹蟎標註工具</h1>
      <p>把蜂群照片切格、標記正常 / 異常，匯出成 PatchCore 可用的資料集</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="settings-toggle-btn" class="settings-trigger-btn" title="上傳照片與設定" aria-label="上傳照片與設定">
      <span>📁 上傳照片 / 設定</span>
    </button>
  </div>
</header>

<div class="layout">

  <!-- 左側常駐統計與工具欄 -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-top">
      <button id="photo-list-toggle-btn" class="photo-list-toggle-btn" title="展開照片清單">
        <span>📋 照片清單</span>
        <span id="photo-badge" class="photo-badge">0</span>
      </button>
    </div>

    <!-- 左側直接常駐顯示統計與匯出（無需展開） -->
    <div class="sidebar-summary" id="summary-panel">
      <div class="summary-section-title">標註統計</div>
      <div class="summary-item-row">
        <span class="summary-label">總格數</span>
        <span class="summary-num" id="count-total">0</span>
      </div>
      <div class="summary-item-row is-normal">
        <span class="summary-label">正常</span>
        <span class="summary-num" id="count-normal">0</span>
      </div>
      <div class="summary-item-row is-abnormal">
        <span class="summary-label">異常</span>
        <span class="summary-num" id="count-abnormal">0</span>
      </div>
      <div class="summary-item-row">
        <span class="summary-label">未標</span>
        <span class="summary-num" id="count-unlabeled">0</span>
      </div>
      <button id="export-btn" class="primary-btn export-btn-full" disabled>匯出資料集 (.zip)</button>
    </div>
  </aside>

  <!-- 照片清單抽屜（點擊上方「照片清單」時展開） -->
  <div id="photo-list-drawer" class="photo-list-drawer collapsed">
    <div class="drawer-header">
      <span class="drawer-title">照片清單</span>
      <div class="drawer-actions">
        <button id="sidebar-clear-all" class="sidebar-icon-btn" title="清除全部照片" aria-label="清除全部照片">🗑</button>
        <button id="drawer-close-btn" class="sidebar-icon-btn" title="關閉清單" aria-label="關閉清單">✕</button>
      </div>
    </div>
    <ul id="sidebar-list" class="sidebar-list">
      <li id="sidebar-empty-msg" class="sidebar-empty">尚未上傳照片</li>
    </ul>
  </div>

  <!-- 中間主要標註工作區（無需滾動） -->
  <div class="content">
    <main id="main-workbench">
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">🐝</div>
        <h2>尚未載入照片</h2>
        <p>請點擊右上角「📁 上傳照片 / 設定」上傳蜂群照片進行切格與標註</p>
        <button id="empty-upload-btn" class="primary-btn">選擇照片上傳</button>
      </div>
      <section id="photos-container" class="photos-container"></section>
    </main>
  </div>

  <!-- 右側摺疊欄：上傳照片與切割設定 -->
  <aside id="settings-sidebar" class="settings-sidebar collapsed">
    <div class="settings-header">
      <h3>⚙️ 上傳與切格設定</h3>
      <button id="settings-close-btn" class="sidebar-icon-btn" title="收合設定" aria-label="收合設定">✕</button>
    </div>
    <div class="settings-body">
      <label class="field">
        <span class="field-title">選擇照片檔案</span>
        <input type="file" id="photo-input" accept="image/*" multiple>
      </label>

      <div class="settings-grid">
        <label class="field">
          <span>列數</span>
          <input type="number" id="rows-input" value="4" min="1" max="16">
        </label>
        <label class="field">
          <span>欄數</span>
          <input type="number" id="cols-input" value="8" min="1" max="16">
        </label>
        <label class="field">
          <span>重疊 (px)</span>
          <input type="number" id="overlap-input" value="15" min="0" max="100">
        </label>
      </div>

      <div class="settings-hint">
        <h4>💡 操作指南</h4>
        <ul>
          <li>點選格子：切換「未標 → 正常 → 異常」</li>
          <li><b>按住滑鼠拖曳</b>：批次塗刷多個格子</li>
          <li>快速鍵：滑鼠移到格子上按 <kbd>1</kbd>=正常、<kbd>2</kbd>=異常、<kbd>0</kbd>=清除</li>
          <li>切換照片：按右下角按鈕或鍵盤 <kbd>←</kbd> / <kbd>→</kbd> (或 <kbd>A</kbd> / <kbd>D</kbd>)</li>
        </ul>
      </div>
    </div>
  </aside>

</div>

<!-- 右下角浮動上下頁切換紐 -->
<div class="floating-pager" id="floating-pager" hidden>
  <button id="prev-photo-btn" class="pager-btn" title="上一張照片 (快捷鍵 ← 或 A)" aria-label="上一張照片">◂ 上一張</button>
  <span class="pager-info" id="pager-info">0 / 0</span>
  <button id="next-photo-btn" class="pager-btn" title="下一張照片 (快捷鍵 → 或 D)" aria-label="下一張照片">下一張 ▸</button>
</div>

<div id="loading-overlay" class="loading-overlay" hidden>
  <div class="loading-box">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">處理照片中…</p>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<div id="zoom-preview" class="zoom-preview" hidden>
  <img id="zoom-preview-img" src="" alt="">
  <div class="zoom-caption" id="zoom-preview-caption"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
